name: TikTok Lite 話題BOT

on:
  schedule:
    # 日本時間 03:17 / 09:17 / 15:17 / 21:17 ごろ
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      test_line:
        description: "LINE接続テストだけを送る"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tiktok-lite-topic-bot
  cancel-in-progress: false

jobs:
  collect-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 自動テスト
        run: python -m unittest test_bot -v

      - name: LINE接続テスト
        if: "${{ github.event_name == 'workflow_dispatch' && inputs.test_line }}"
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python bot.py --test-line

      - name: 話題を収集してLINE通知
        if: "${{ github.event_name == 'schedule' || inputs.test_line != true }}"
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python bot.py --state state.json --latest latest.json

      - name: 通知済みデータを保存
        if: "${{ github.event_name == 'schedule' || inputs.test_line != true }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json latest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update topic bot state [skip ci]"
          git push
